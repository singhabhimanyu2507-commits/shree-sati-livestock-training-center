<!DOCTYPE html>
<html>
<head>
  <title>SSLTC Registration Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial;
      background:#f2f2f2;
      padding:20px;
    }

    .box{
      max-width:500px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    input, select{
      width:100%;
      padding:10px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:12px;
      background:green;
      color:white;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:darkgreen;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>SSLTC Registration Form</h2>

  <input id="name" placeholder="Full Name">
  <input id="father" placeholder="Father Name">
  <input id="mobile" placeholder="Mobile Number">
  <input id="address" placeholder="Address">
  <input id="dob" type="date">
  <input id="aadhaar" placeholder="Aadhaar Number">

  <select id="course">
    <option value="">Select Course</option>
    <option>Livestock Training</option>
    <option>Animal Husbandry</option>
  </select>

  <!-- 📸 FILE UPLOADS -->
  <label>Passport Photo</label>
  <input type="file" id="photo" accept="image/*">

  <label>Aadhaar Front</label>
  <input type="file" id="aadhaarFront" accept="image/*">

  <label>Aadhaar Back</label>
  <input type="file" id="aadhaarBack" accept="image/*">

  <button onclick="submitForm()">Submit Registration</button>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtpXVcxWPHB9Sf_jEpXG7segIJwVSeKLzcZwJ8rtR1uuXmHR-n2NqTajk896uihYjL/exec";

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = error => reject(error);
  });
}

async function submitForm() {

  const photoFile = document.getElementById("photo").files[0];
  const frontFile = document.getElementById("aadhaarFront").files[0];
  const backFile = document.getElementById("aadhaarBack").files[0];

  const data = {
    name: document.getElementById("name").value,
    fatherName: document.getElementById("father").value,
    mobile: document.getElementById("mobile").value,
    address: document.getElementById("address").value,
    dob: document.getElementById("dob").value,
    aadhaar: document.getElementById("aadhaar").value,
    course: document.getElementById("course").value,

    photo: photoFile ? await toBase64(photoFile) : "",
    aadhaarFront: frontFile ? await toBase64(frontFile) : "",
    aadhaarBack: backFile ? await toBase64(backFile) : ""
  };

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    alert("Registration Successful + Photos Uploaded ✅");

  } catch (err) {
    console.log(err);
    alert("Error ❌ Check connection");
  }
}

</script>

</body>
</html>
